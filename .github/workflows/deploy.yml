name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prisma is present in the codebase but unused at runtime; these dummies
      # only satisfy `prisma generate`, which never opens a connection.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bacmentor"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/bacmentor"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Project sites live at https://<owner>.github.io/<repo>/, so every asset
      # and route must be prefixed. A <owner>.github.io repo is served from /.
      - name: Compute base path
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" =~ ^[A-Za-z0-9-]+\.github\.io$ ]]; then
            base=""
          else
            base="/$repo"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "Base path: '$base'"

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
